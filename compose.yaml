name: properpcloud

services:
  android-build:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ANDROID_CMDLINE_TOOLS_VERSION: ${ANDROID_CMDLINE_TOOLS_VERSION:-15859902}
        ANDROID_CMDLINE_TOOLS_SHA256: ${ANDROID_CMDLINE_TOOLS_SHA256:-4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583}
        ANDROID_PLATFORM: ${ANDROID_PLATFORM:-37.0}
        ANDROID_BUILD_TOOLS: ${ANDROID_BUILD_TOOLS:-37.0.0}
    image: ${PROPERPCLOUD_BUILD_IMAGE:-properpcloud/android-build:2026.08}
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    environment:
      HOME: /tmp/properpcloud-home
      GRADLE_USER_HOME: /gradle-cache
      PCLOUD_CLIENT_ID: ${PCLOUD_CLIENT_ID:-}
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ./.cache/gradle:/gradle-cache
    command:
      - :app:assembleDebug
