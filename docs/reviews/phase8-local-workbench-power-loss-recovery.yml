      status: passed_current_host
      evidence: make desktop-test passed 37 of 37 tests in properpcloud/android-build:2026.08
    real_process_kill_restart_reselection:
      status: pending_runtime
      note: authored Kotlin regression uses an Error immediately after target replacement to skip normal disarm and reconstructs fresh identity/authority objects for the restart boundary, but a packaged executable has not yet been launched, terminated, and restarted for this proof
    physical_power_cut_filesystem_durability:
      status: not_exercised_hardware
    packaged_native_smoke:
      status: passed_current_host
