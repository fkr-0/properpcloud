  status: passed_current_host_packaged_process
  objective: >-
    Exercise the Phase-8 durable local-tag recovery authority across a real packaged process
    termination and fresh packaged process restart without claiming physical power-cut durability.
  implementation:
    packaged_entrypoints:
      - --local-tag-recovery-kill-smoke requires an explicit selected-root argument
      - --local-tag-recovery-restart-smoke requires that root to be supplied again to the fresh process
    first_process:
      - creates a synthetic local-only fixture under the explicitly supplied scratch root
      - uses the production DesktopLocalTagRecoveryAuthority and FolderTagApplyService recovery ordering
      - performs a real same-directory ATOMIC_MOVE + REPLACE_EXISTING of the exact staged candidate
      - prints readiness only after the replacement boundary has completed
      - deliberately blocks before normal verification/disarm so the shell harness can terminate the process externally
    termination:
      mechanism: external_SIGKILL
      expected_exit_code: 137
      normal_disarm_after_replacement: not_executed
    fresh_process:
      - launches the packaged executable again
      - receives the scratch root again as the non-interactive explicit-reselection boundary
      - constructs the normal DesktopLocalFolderBinding for that selected root
      - binding open rediscovers the durable recovery authority
      - rediscovered result remains INDETERMINATE until guarded recovery
      - rollback uses the existing exact-current-hash guard and verifies the exact original fixture bytes
      - verified rollback clears durable cross-process recovery authority
