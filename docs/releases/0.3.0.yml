version: 0.3.0
tag: v0.3.0
status: release
base_release: v0.2.0-rc.11
date: 2026-11-01
objective: >-
  package rename to dev.fkr.properpcloud, modernized release signing,
  Material3 UI/UX improvements, and consolidation of the 0.2.0 RC line
included_work:
  - rename root package from dev.properpcloud to dev.fkr.properpcloud across all modules
  - modernize Android release signing to ANDROID_KEYSTORE_* pattern with keystore.properties
  - add release build type with R8 minification and ProGuard rules
  - add complete Material3 Typography scale and edge-to-edge display support
  - improve empty and error state screens with better visual hierarchy
  - update CI workflows for new signing variable names and multi-variant APK upload
  - update Linux packaging identifiers to dev.fkr.properpcloud.app
migration_note: >-
  the applicationId change from dev.properpcloud.app to dev.fkr.properpcloud.app
  requires uninstall/reinstall on existing devices; CI secrets must be renamed
  from ANDROID_RELEASE_* to ANDROID_KEYSTORE_* pattern
verification:
  - make local-check (139 host tests pass)
