release:
  version: 0.2.0
  tag: v0.2.0
  status: implementation_hardened_promotion_gates_explicit
  base_release: v0.1.10
  objective: promote the native Linux client after automated, current-session, visual, soak, and protected-provider evidence is complete
  implementation:
    shared_semantics:
      - queue restoration and stable selected identity
      - progress checkpoint and resume policy
      - bounded signed-link capability refresh shared by Android and Linux
    desktop:
      - Compose Desktop folder browser, inspector, queue, and player
      - SQLite state, Secret Service credentials, mpv JSON IPC, and MPRIS
      - explicit process restart and one bounded stream-capability refresh
      - keyboard-first library and queue operations with no drag-only action
      - native unsandboxed selected-directory local metadata workbench with final-boundary hash guards, mutation-blocking indeterminate outcomes, exact-hash rollback, and pre-replacement durable recovery authority for explicit restart/reselection recovery
    packaging:
      - application image
      - tagged AppImage and Flatpak packages
      - immutable-source Arch PKGBUILD and executable clean-build gate
  automated_evidence:
    required_commands:
      - make release-020-readiness
      - python3 -m unittest -v tests.test_phase7_local_workbench_release_boundary
      - python3 -m unittest -v tests.test_phase8_local_workbench_power_loss_recovery
      - python3 -m unittest -v tests.test_phase9_local_recovery_process_smoke
      - make test
      - make desktop-test
      - make desktop-local-tag-recovery-process-smoke
      - make linux-ci
      - make desktop-session-audit
      - make desktop-sleep-monitor-smoke
      - PROPERPCLOUD_SOAK_SECONDS=120 make desktop-resilience-soak
      - make docs-build
    readiness_matrix: docs/reviews/0.2.0-promotion-matrix.yml
    pre_tag_gate: python3 scripts/validate-020-readiness.py --pre-tag
    publication_gate: python3 scripts/validate-020-readiness.py --strict
  current_session_evidence:
    command: make desktop-session-audit
    result: passed_on_current_gnome_i3_x11_session
    evidence: build/evidence/0.2.0-current-session.json
    privacy: disposable random Secret Service value only; value and D-Bus address are never recorded
    limitations:
      - physical media-key behavior requires the active desktop daemon or keyboard
      - a real suspend and resume cycle requires an operator-controlled session transition
  current_host_evidence:
    arch_v0_1_9:
      result: passed
      evidence: build/evidence/0.1.9-arch-package.json
      package_sha256: ab302413fe19a44e0065afe28acdb3f1f111be54b846e827b6906234e3bd63c9
    resilience_soak:
      result: passed
      evidence: build/evidence/0.2.0-resilience-soak.json
      duration_seconds: 120
      cycles: 342
      maximum_resume_drift_millis: 479
    locked_keyring:
      result: passed_isolated_ephemeral
      evidence: build/evidence/0.2.0-locked-keyring.json
      lookup_bound_millis: 5000
      real_user_keyring_touched: false
    accessibility_scale_contrast:
      result: passed_automated_capture
      evidence: build/evidence/0.2.0-accessibility.json
      ui_scale_percent: 200
      window: 1280x820
    mpris_external_controls:
      result: passed_current_session
      evidence: build/evidence/0.2.0-current-session.json
      control_method_count: 9
    suspend_resume_implementation:
      result: passed_current_host
      evidence: build/evidence/0.2.0-current-session.json
      physical_cycle: pending_manual
  phase7_local_workbench_evidence:
    source_contracts:
      result: passed_current_host
      evidence: docs/reviews/phase7-local-workbench-release-boundary.yml
      checks: 10_of_10
    kotlin_recovery_regressions:
      result: passed_current_host
      command: make desktop-test
      evidence: 37_of_37_desktop_tests_passed_in_pinned_properpcloud_android_build_2026_08
    packaged_accessibility_and_smoke:
      result: blocked_upstream_linux_at_spi
      evidence:
        - build/evidence/0.2.0-accessibility.json
        - docs/reviews/phase10-local-workbench-accessibility.yml
      passed_current_host: packaged desktop smoke, 200 percent high-contrast capture, and explicit Compose semantics source/test coverage
      remaining: selected-folder keyboard/focus/large-text review plus a supported Linux AT-SPI bridge before real screen-reader traversal can be claimed
      upstream_boundary: current Compose Multiplatform desktop accessibility documentation states Linux is not supported
    cross_process_power_loss_recovery:
      result: superseded_by_phase8_durable_recovery_implementation
      evidence: docs/reviews/phase8-local-workbench-power-loss-recovery.yml
    flatpak_local_folder_boundary:
      result: fallback_boundary_selected
      decision: remain fail-closed until a document-portal directory lease exists; do not add host or home filesystem access
  phase8_local_workbench_power_loss_evidence:
    source_contracts:
      result: passed_current_host
      evidence: docs/reviews/phase8-local-workbench-power-loss-recovery.yml
      checks: 10_of_10
    durable_recovery_implementation:
      result: passed_source_contracts
      behavior: recovery authority is armed before replacement, persists no complete private path, requires explicit root reselection, and reconstructs rollback only from exact current/result/original hashes
    kotlin_restart_regressions:
      result: passed_current_host_simulation
      command: make desktop-test
      evidence: desktop Kotlin and JUnit suite passed in pinned properpcloud/android-build:2026.08
      limitation: the unit regression remains an in-process simulation; Phase 9 separately exercises real packaged process termination/restart
    real_packaged_process_restart_reselection:
      result: passed_current_host
      command: make desktop-local-tag-recovery-process-smoke
      evidence:
        - docs/reviews/phase9-local-recovery-process-smoke.yml
        - build/evidence/0.2.0-local-tag-recovery-process.json
      behavior: first packaged process is externally SIGKILLed after the recovery-armed atomic replacement; fresh packaged process receives the root again, rediscovers durable recovery, and verifies exact-hash guarded rollback
      privacy: retained JSON records no selected-root/media path, provider URL, or credential
    real_power_cut_durability:
      result: pending_hardware
      reason: no physical power-cut filesystem durability exercise is available in this session
    flatpak_local_folder_boundary:
      result: fallback_boundary_selected
      decision: remain fail-closed; no host/home permission or document-portal shortcut was added
  remaining_blockers:
    - real power-cut filesystem durability evidence for the native recovery record/replacement ordering
    - packaged selected-folder keyboard/focus/large-text local-workbench review
    - Linux AT-SPI/screen-reader support is blocked by the current Compose Multiplatform Linux accessibility boundary; final promotion requires an explicit maintainer exception or a supported accessibility bridge/UI strategy
    - exact immutable v0.2.0 Arch archive rebuild after tag creation
    - protected Europe pCloud playback, expiry, disconnect, and restart
    - protected United States pCloud playback, expiry, disconnect, and restart
    - four-hour retained provider soak with one real capability expiry and suspend/resume
    - GNOME and KDE Plasma session observations beyond the current i3 session
    - human screen-reader traversal/action review after a supported Linux accessibility bridge exists
    - physical media-key daemon observation
    - one real suspend and resume cycle
  publication_rule: no version bump or tag until pre-tag readiness passes; no publication until strict post-tag readiness passes or every exception is explicitly accepted by the maintainer
