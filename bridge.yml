version: 1
name: properpcloud
description: Folder-first Android and Linux audio playback for pCloud and extensible file-oriented sources.
defaultTrack: local
shell: true
syncDir:
  - .

agent:
  notes: |
    Keep provider-specific code behind core-model interfaces. Never commit OAuth tokens,
    pCloud passwords, app secrets, signed stream URLs, local.properties, APKs, or private media.
    VERSION is canonical; published tags are immutable. make ci is the merge/release gate.
  tasks:
    - Register the properpcloud pCloud application, set PCLOUD_CLIENT_ID, and run protected US/EU OAuth/logout validation.
    - Complete the external 0.1.5 physical-device process-death and accessibility matrix.
    - Add artwork and optional local Chromaprint/AcoustID adapters after provider-term review.
    - Implement remote replacement only when pCloud exposes an atomic expected-revision primitive.
    - Run physical-device TalkBack, large-font, codec, and process-death validation.
    - Run protected Linux EU/US pCloud playback, expiry, disconnect, and restart validation.
    - Validate Secret Service and MPRIS across GNOME, KDE Plasma, and i3 sessions.
    - Add reproducible Arch and broad-distribution desktop release artifacts.
  changelog:
    - Released and tagged the verified architecture bootstrap as 0.0.1.
    - Implemented the adaptive Compose Android 0.1.0 client with deterministic demo media.
    - Added encrypted pCloud OAuth, durable queue/progress, JIT Media3 links, and expanded tests.
    - Added tag-driven GitHub releases, artifact evidence, attestations, and repository health files.
    - Published v0.1.0 from its immutable tag and recorded independent post-release audits.
    - Prepared 0.1.1 with immutable Action pins, exact-tag release dispatch, and wrapper integrity validation.
    - Released v0.1.1 with green Android and release workflows.
    - Prepared 0.1.2 with a first-class player, staged tag tooling, batch plans, and MusicBrainz foundations.
    - Prepared 0.1.3 with Tag studio, reviewed batch editing, exact pCloud staging, and verified exports.
    - Prepared 0.1.4 with bundled application identity, one-tap OAuth, and local-first remote token revocation.
    - Prepared 0.1.5 with lifecycle progress durability, bounded link retry, visible restoration failures, and Linux parity fixtures.
    - Converted the core, provider, WebDAV, and metadata adapters to portable JVM modules.
    - Implemented native Compose Desktop browsing, queueing, SQLite, Secret Service, mpv JSON IPC, MPRIS, and host smoke verification.
    - Added a Markdown user manual and developer API reference rendered by Astro Starlight for GitHub Pages.

commands:
  image:
    description: Build the checksum-verified Android toolchain image
    category: build
    cwd: .
    timeoutMs: 1200000
    run: ["make", "image"]
  doctor:
    description: Verify Docker image and committed Gradle Wrapper
    category: test
    cwd: .
    timeoutMs: 300000
    run: ["make", "doctor"]
  release-check:
    description: Validate SemVer, changelog, license, specs, and package version agreement
    category: test
    cwd: .
    timeoutMs: 300000
    run: ["make", "release-check"]
  test:
    description: Run JVM, provider, persistence, and Robolectric Compose tests in Docker
    category: test
    cwd: .
    timeoutMs: 1200000
    run: ["make", "test"]
  build:
    description: Build the installable debug/demo APK in Docker
    category: build
    cwd: .
    timeoutMs: 900000
    run: ["make", "build"]
  desktop-test:
    description: Run native Linux adapter, generated-media, and SQLite tests
    category: test
    cwd: .
    timeoutMs: 900000
    run: ["make", "desktop-test"]
  desktop-smoke:
    description: Exercise a real host mpv process, Unix JSON IPC, and SQLite state
    category: test
    cwd: .
    timeoutMs: 900000
    run: ["make", "desktop-smoke"]
  desktop-package:
    description: Build the Compose Desktop Linux application image
    category: build
    cwd: .
    timeoutMs: 1200000
    run: ["make", "desktop-package"]
  desktop-appimage:
    description: Build the checksum-pinned x86_64 AppImage
    category: build
    cwd: .
    timeoutMs: 1200000
    run: ["make", "desktop-appimage"]
  desktop-flatpak:
    description: Build the x86_64 single-file Flatpak bundle
    category: build
    cwd: .
    timeoutMs: 1800000
    run: ["make", "desktop-flatpak"]
  linux-packages:
    description: Build AppImage and Flatpak release packages
    category: build
    cwd: .
    timeoutMs: 2400000
    run: ["make", "linux-packages"]
  desktop-mpris-smoke:
    description: Verify packaged MPRIS properties over an isolated D-Bus session
    category: test
    cwd: .
    timeoutMs: 1200000
    run: ["make", "desktop-mpris-smoke"]
  linux-ci:
    description: Run native Linux unit, package, mpv, SQLite, and MPRIS verification
    category: test
    cwd: .
    timeoutMs: 1800000
    run: ["make", "linux-ci"]
  docs-build:
    description: Validate Markdown and build the Astro Starlight Pages artifact
    category: build
    cwd: .
    timeoutMs: 600000
    run: ["make", "docs-build"]
  lint:
    description: Run Android lint in Docker
    category: lint
    cwd: .
    timeoutMs: 900000
    run: ["make", "lint"]
  ci:
    description: Run release metadata, specs, tests, lint, and APK assembly
    category: test
    cwd: .
    timeoutMs: 1800000
    run: ["make", "ci"]
  release-artifacts:
    description: Create the Android release baseline, checksums, evidence, and release notes
    category: build
    cwd: .
    timeoutMs: 300000
    run: ["make", "release-artifacts"]
  list:
    description: List project files
    category: custom
    cwd: .
    run: ["find", ".", "-maxdepth", "3", "-type", "f"]
