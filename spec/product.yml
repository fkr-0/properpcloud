product:
  id: properpcloud
  vision: >-
    A trustworthy folder-first audio client for pCloud and other file-oriented sources,
    with excellent long-form playback, transparent metadata, and no forced dependence
    on unreliable tag-derived artist, album, and song libraries.
  problem:
    failures_to_remove:
      - The file browser cannot enqueue a folder into the player.
      - The player cannot navigate to the current file's containing folder.
      - Malformed tags dominate navigation and ordering even when paths are canonical.
      - Common playback actions require per-file context menus.
      - Long recordings and audiobooks lack durable, inspectable progress semantics.
    user_costs:
      - repeated manual work
      - incorrect chapter or track ordering
      - lost position
      - unclear metadata provenance
      - provider UI lock-in
  principles:
    - id: P-FILESYSTEM-TRUTH
      rules:
        - Preserve source, parent folder, filename, stable ID, and relative path context.
        - Expose folder navigation wherever a track is displayed.
        - A playable extension or MIME type remains discoverable despite missing tags.
    - id: P-TAGS-ENRICH
      rules:
        - Tags enrich display, grouping, and search.
        - Tags never replace stable identity or remove folder navigation.
        - Raw, normalized, inferred, and effective values remain distinguishable.
    - id: P-PROGRESSIVE-POWER
      rules:
        - Safe common actions are visible.
        - Advanced filters, grouping, inspection, and repair are progressively disclosed.
    - id: P-CAPABILITY-PORTS
      rules:
        - Browse, stream, search, change feed, mutation, and cache are independent capabilities.
        - Missing optional capabilities degrade features rather than disabling the source.
    - id: P-EXPLICIT-STATE
      rules:
        - Show loading, stale, cached, offline, partial, failed, and authenticated states.
        - Recursive operations summarize every omission category.
    - id: P-REVERSIBLE-MUTATION
      rules:
        - Metadata repair is dry-run first.
        - Remote replacement requires expected revision or content hash.
        - Every write is verified and recorded.
  personas:
    folder_curator:
      goals:
        - Use folders and filenames as the authoritative collection.
        - Play complete folders in deterministic order.
        - Save roots for music, audiobooks, lectures, and recordings.
      pains: [broken ID3 grouping, deep context menus, pathless search results]
    long_form_listener:
      goals:
        - Resume exactly and predictably.
        - Use speed, skip, bookmarks, sleep timer, and completion state.
        - See progress across a folder or book.
      pains: [position loss, bad chapter order, accidental restart]
    metadata_maintainer:
      goals:
        - Inspect provider data, embedded tags, inferred values, and candidates.
        - Approve controlled batch corrections.
        - Recover from an incorrect write.
      pains: [opaque parsing, destructive batch edits, no provenance]
    multi_device_user:
      goals:
        - Use comparable Android and Linux clients.
        - Share semantics and optionally progress without a mandatory custom server.
  release_slices:
    mvp_0_1:
      name: validated-android-folder-player
      requirements:
        - REQ-AUTH
        - REQ-BROWSE
        - REQ-QUEUE
        - REQ-NAVIGATION
        - REQ-PLAYBACK
        - REQ-SORTING
        - REQ-PROGRESS
        - REQ-INSPECTION
        - REQ-RESILIENCE
    v0_1_2:
      name: modern-player-and-metadata-foundation
      requirements:
        - REQ-MODERN-PLAYER
        - REQ-METADATA-FOUNDATION
    v0_1_3:
      name: reviewed-tag-studio-and-safe-export
      requirements:
        - REQ-METADATA-FOUNDATION
    v0_1_4:
      name: ordinary-oauth-onboarding-and-revocation
      requirements:
        - REQ-AUTH
    v0_1_5:
      name: android-semantic-freeze-and-lifecycle-hardening
      requirements:
        - REQ-PLAYBACK
        - REQ-PROGRESS
        - REQ-RESILIENCE
    v0_1_6:
      name: interim-direct-login-and-account-ux
      requirements:
        - REQ-AUTH
    v0_1_11:
      name: folder-scoped-tag-workbench
      requirements:
        - REQ-FOLDER-TAG-WORKBENCH
    v0_2:
      name: native-linux-feature-parity
      requirements: [REQ-LINUX-PARITY]
    v0_3:
      name: long-form-roots-offline
      requirements: [REQ-LONGFORM, REQ-SAVED-ROOTS, REQ-OFFLINE, REQ-AUTO]
    v0_4:
      name: controlled-library-maintenance
      requirements: [REQ-METADATA-PROPOSAL, REQ-METADATA-WRITE, REQ-CHANGEFEED]
  requirements:
    REQ-MODERN-PLAYER:
      priority: must
      release: v0_1_2
      title: First-class Android now-playing experience
      behaviors:
        - Mini-player opens a dedicated now-playing destination.
        - Now playing exposes title, filename context, seekable timeline, elapsed and remaining time.
        - Previous, rewind, play or pause, forward, and next controls remain accessible.
        - Queue position, next item, containing folder, and metadata inspection are one action away.
        - Queue rows use compact progressive disclosure while retaining non-drag reorder alternatives.
        - Metadata inspection uses a structured adaptive sheet rather than an oversized blocking dialog.
      invariants:
        - Playback remains owned by MediaSessionService.
        - The player never hides stable filename or containing-folder navigation.
        - Unknown or non-seekable duration disables scrubbing without disabling playback.
    REQ-METADATA-FOUNDATION:
      priority: must
      release: v0_1_3
      title: Safe tag maintenance foundation
      behaviors:
        - Represent canonical tag fields, provenance, confidence, snapshots, patches, and batch plans in core-model.
        - Require expected revision or content hash for remotely targetable edit plans.
        - Inspect and edit a local staged copy through a replaceable jaudiotagger adapter.
        - Reread and verify intended tag changes while proving original bytes remain unchanged.
        - Search MusicBrainz through an identified, rate-limited, HTTPS client.
        - Present original values, provenance, editable drafts, and field-level candidate acceptance in Tag studio.
        - Support bounded batch common-field edits and deterministic track sequencing.
        - Prepare exact pCloud source bytes with provider SHA-256 and matching pre/post revision evidence.
        - Export verified candidates as one file or a ZIP plus manifest through scoped Android content URIs.
        - Model Cover Art Archive and opt-in AcoustID lookup without embedding service keys.
        - Disclose that pCloud remote replacement remains disabled because the SDK lacks atomic expected-revision overwrite.
      forbidden:
        - automatic remote metadata writes
        - online candidate acceptance without field-level review
        - audio-byte upload to metadata lookup services
        - credentials or fingerprints in logs and release evidence
    REQ-FOLDER-TAG-WORKBENCH:
      priority: should
      release: v0_1_11
      title: Folder-scoped tag review, correction proposals, and guarded local apply
      behaviors:
        - Open a dedicated workbench for the playable direct children of exactly one selected folder.
        - Keep filename, folder, stable identity, current tags, warnings, proposals, and changed-on-disk state visible together.
        - Register a folder observer without an initial-scan gap and reconcile create, modify, delete, move, overflow, and invalidation events.
        - Generate deterministic local correction proposals before any optional online matching.
        - Treat autocorrect as proposal generation and safe preselection, never unattended writing.
        - Invalidate approval when content evidence changes after a proposal was reviewed.
        - Apply approved local edits through sibling staging, reread verification, decoder validation, atomic replacement, final readback, and rollback.
        - Degrade to verified export when atomic local replacement is unavailable.
        - Preserve drafts and redacted audit evidence without turning tags into media identity.
      forbidden:
        - implicit recursive library rewriting
        - unattended or timer-triggered media mutation
        - following symbolic links outside the selected folder
        - unsafe non-atomic overwrite fallback
        - remote replacement without an atomic expected-revision or expected-hash primitive
    REQ-AUTH:
      priority: must
      release: v0_1_4
      title: Safe pCloud session establishment and revocation
      behaviors:
        - Prefer provider-hosted OAuth whenever a bundled or explicit public client ID is available.
        - Published builds bundle the registered public client ID; unconfigured source builds keep OAuth unavailable and retain the fallback direct path.
        - Local Make and Compose builds may resolve only PCLOUD_CLIENT_ID from an ignored dotenv file.
        - The client-side token flow never consumes, embeds, exports, or distributes the application client secret.
        - Developer builds may override the bundled public client ID explicitly.
        - Authorize in a trusted provider or system surface.
        - Offer a clearly labelled fallback-only direct-login path implementing pCloud's documented HTTPS username/password token exchange.
        - Require explicit Europe or United States selection and send direct-login credentials to exactly one allowlisted regional host.
        - Clear direct-login password form state before dispatch and never persist, log, export, back up, or restore the password.
        - Persist OAuth bearer or legacy auth token plus token kind in platform secret storage.
        - Persist non-secret regional API location and account identity separately.
        - Restore sessions without restoring or recollecting an account password.
        - Send legacy auth tokens and method parameters through HTTPS POST bodies rather than URLs.
        - Disconnect immediately locally and attempt remote revocation when supported.
        - Surface local removal and remote revocation as separate outcomes.
      forbidden:
        - tokens in logs, backups, crash reports, exported settings, or UI
        - password persistence, logging, analytics, backup, export, saved-state restoration, or cross-region probing
        - credentials in URL query parameters
        - client secrets in source, BuildConfig, CI variables, or release artifacts
    REQ-BROWSE:
      priority: must
      release: mvp_0_1
      title: Folder-first browser
      behaviors:
        - Browse root and nested folders using stable provider IDs.
        - Show breadcrumb, filename, type, optional duration, and source state.
        - Preserve active sort and stable folder identity while navigating.
        - Refresh without replacing stable identity with display paths.
        - Optionally show non-audio children while excluding them from audio queues.
      scalability:
        - Lazily render folders above 500 direct children.
        - Never recursively enumerate on the main thread.
    REQ-QUEUE:
      priority: must
      release: mvp_0_1
      title: Folder-to-queue operations
      operations:
        - play_folder_replace
        - append_folder
        - play_folder_next
        - play_subtree_replace
        - append_subtree
      rules:
        - Deterministic enumeration precedes every queue mutation.
        - Queue entries record source folder and stable source/node identity.
        - Recursive operations expose progress, cancellation, partial acceptance, and omissions.
        - Duplicate policy supports preserve and stable-node collapse.
        - An empty result never silently clears an existing queue.
    REQ-NAVIGATION:
      priority: must
      release: mvp_0_1
      title: Bidirectional browser and player navigation
      behaviors:
        - Now playing exposes open-containing-folder in one action.
        - Queue rows expose open-containing-folder and inspect.
        - Folder rows expose capability-appropriate play, append, next, subtree, and inspect actions.
        - Opening a folder from playback does not interrupt playback.
    REQ-PLAYBACK:
      priority: must
      release: mvp_0_1
      title: Reliable remote playback
      behaviors:
        - Resolve fresh direct links from stable file IDs just in time.
        - Treat direct links as expiring secrets, not persistent identity.
        - Support seeking and HTTP ranges when provider and format permit.
        - Refresh a link after an eligible expiry or authorization response.
        - Preserve queue and last confirmed position across reconnects and process death.
        - Integrate with OS media controls, audio focus, headphones, and foreground execution.
      retry_policy:
        idempotent_only: true
        bounded: true
        immediate_refreshes_per_failure_window: 1
        later_retry_after_cooldown: true
        categories: [link_resolution, transient_transport, provider_rate_limit]
    REQ-SORTING:
      priority: must
      release: mvp_0_1
      title: Explicit ordering and grouping
      sort_keys:
        - natural_filename
        - disc_then_track
        - tagged_title
        - modified_time
      invariants:
        - Numeric filename segments sort 2 before 10.
        - Unknown disc or track numbers sort after known values unless filename-only is selected.
        - Active sort and grouping are visible and reversible.
        - Tie breaking is deterministic by natural filename then stable node ID.
    REQ-PROGRESS:
      priority: must
      release: v0_1_5
      title: Long-form progress persistence
      record:
        - source_id
        - node_id
        - content_revision
        - position_ms
        - duration_ms
        - playback_speed
        - completion_state
        - observed_at
      checkpoints:
        - periodic
        - pause
        - completed_seek
        - item_transition
        - app_background
        - service_teardown
        - queue_replacement
        - playback_error
        - task_removal
      policies:
        music_resume_default: disabled
        long_form_resume_default: enabled
        classification_inputs:
          - saved-root policy
          - folder override
          - extension such as m4b
          - duration threshold
          - explicit item override
        smart_rewind:
          enabled: true
          depends_on: interruption duration
        revision_change:
          action: ask before applying stale progress to materially changed content
    REQ-INSPECTION:
      priority: must
      release: mvp_0_1
      title: Clean metadata inspection
      sections:
        provider:
          fields:
            - stable IDs and parent ID
            - parent identity
            - filename, MIME type, and optional size
            - provider timestamps and permissions when available
        effective:
          fields:
            - display title
            - active sort values
            - active filename or tagged-title display choice
            - source and generated-demo provenance
      constraints:
        - Inspection is read-only.
        - Raw values remain available.
        - Signed URLs and credentials are redacted.
    REQ-RESILIENCE:
      priority: must
      release: v0_1_5
      title: Honest degraded operation
      behaviors:
        - Provide a complete playable local demo while offline.
        - Preserve durable queue/progress references through process death.
        - Distinguish auth, network, provider, media, and storage failures.
        - Preserve queue and progress through process death.
        - Every asynchronous state has timeout, retry, cancellation, and stale-data semantics where applicable.
        - Infinite loading indicators are forbidden.
        - Playback-controller and persisted-queue restoration failures are visible and actionable.
        - Android queue/progress persistence is frozen as a replayable cross-platform fixture corpus.
    REQ-LINUX-PARITY:
      priority: must
      release: v0_2
      title: Native Linux desktop feature parity
      behaviors:
        - Reuse source identity, sorting, queue, progress, inspection, and pCloud Java-core semantics.
        - Provide native desktop folder, queue, now-playing, settings, and diagnostics surfaces.
        - Use system-browser OAuth and Secret Service or KWallet credential storage.
        - Use mpv JSON IPC with bounded process restart and expiring-link renewal.
        - Integrate MPRIS, media keys, notifications, and XDG paths.
        - Provide mouse, context-menu, and complete keyboard alternatives.
      validation:
        - Run shared contract fixtures unchanged on Android and desktop.
        - Validate GNOME, KDE Plasma, and i3 workflows.
        - Publish Gradle/Arch artifacts and a reviewed Flatpak package.
    REQ-LONGFORM:
      priority: should
      release: v0_3
      title: Audiobook and lecture controls
      features:
        - variable speed with per-root and per-folder memory
        - configurable skip forward and backward
        - sleep timer by duration or end of item
        - bookmarks with optional notes
        - explicit complete and incomplete actions
        - folder and subtree progress aggregation
    REQ-SAVED-ROOTS:
      priority: should
      release: v0_3
      title: Custom tabs and directory policies
      behaviors:
        - Create named tabs from a folder plus recursion, filter, sort, grouping, resume, and cache policy.
        - Reorder, rename, hide, export, and import tabs.
        - Express whitelist and blacklist rules without moving provider files.
      examples:
        - name: Audiobooks
          root: /Audiobooks
          recursive: true
          resume: long_form
          grouping: containing_folder
        - name: New recordings
          root: /Recordings
          filter: modified_within_30_days
          sort: modified_descending
    REQ-OFFLINE:
      priority: should
      release: v0_3
      title: Explicit offline cache
      behaviors:
        - Pin a file, folder, subtree, or saved root.
        - Display required, downloaded, verified, and evictable bytes.
        - Verify content against provider hash where available.
        - Support Wi-Fi-only, charging-only, quota, and retention policies.
        - Distinguish local eviction from cloud deletion in language and iconography.
    REQ-AUTO:
      priority: should
      release: v0_3
      title: Android Auto and external media browsing
      behaviors:
        - Expose saved roots and a shallow folder hierarchy.
        - Prefer voice-friendly labels and non-destructive actions.
        - Keep browse IDs stable across service restarts.
    REQ-METADATA-PROPOSAL:
      priority: should
      release: v0_4
      title: Metadata proposal pipeline
      stages:
        - scan existing tags and provider metadata
        - normalize without mutation
        - infer from filename and path
        - query explicitly enabled external providers
        - rank candidates
        - render field-level diff, provenance, and confidence
        - approve or edit
      safety:
        - No automatic remote write.
        - Low-confidence fields remain unselected by default.
        - External queries disclose which metadata leaves the device.
    REQ-METADATA-WRITE:
      priority: should
      release: v0_4
      title: Revision-safe tag writing
      pipeline:
        - download exact revision to staging
        - apply only approved field changes
        - validate tags and decodability
        - upload with expected original hash or revision
        - re-read remote hash and metadata
        - record audit and recovery revision
      conflict_behavior:
        - Abort before overwrite when remote revision changed.
        - Offer rebase, skip, or rescan; never force silently.
    REQ-CHANGEFEED:
      priority: should
      release: v0_4
      title: Incremental provider synchronization
      behaviors:
        - Persist provider change cursor.
        - Apply changes transactionally to snapshots and indexes.
        - Recover invalid cursors through bounded subtree or full rescan.
  quality_attributes:
    usability:
      - Folder play requires at most one context invocation and one action tap on compact screens.
      - Open-containing-folder is one tap from now playing.
      - Active order is visible from browser and queue.
    accessibility:
      - Semantic labels and minimum touch targets for all controls.
      - Dynamic text never removes the only path or filename representation.
      - TalkBack order matches visual hierarchy.
      - Color is not the sole state indicator.
    performance_targets:
      cold_start_to_cached_browser_ms_p95: 1200
      cached_folder_render_ms_p95: 150
      queue_action_feedback_ms_p95: 100
      stream_start_good_network_ms_p95: 2500
      progress_write_ms_p95: 50
    reliability_targets:
      queue_survives_process_death: true
      progress_loss_window_seconds_max: 15
      mutation_post_write_verification_rate: 1.0
      crash_free_session_ratio: 0.995
    privacy:
      - No analytics by default.
      - Crash reporting is opt-in and redacted.
      - Core operation requires no custom backend.
      - External metadata providers require separate consent.
    security:
      - Platform credential storage protects tokens.
      - Signed stream URLs are excluded from persistent logs.
      - TLS validation is never disabled.
      - Release builds disallow cleartext network traffic.
  non_goals:
    mvp:
      - Replace every pCloud file-management feature.
      - Social music discovery.
      - DRM playback.
      - Server-side transcoding.
      - Automatic destructive metadata correction.
      - Mandatory self-hosted infrastructure.
