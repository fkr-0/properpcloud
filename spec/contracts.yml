contracts:
  conventions:
    identifiers:
      source_id: opaque stable identifier for configured source instance
      node_id: opaque stable identifier interpreted only by its source adapter
      media_id: encoded source_id plus node_id, versioned and reversible without display strings
      operation_id: generated correlation ID without credential data
    time:
      representation: epoch milliseconds in storage, Instant at JVM boundaries
      clock: injected for domain and application tests
    result:
      shape:
        success: typed value plus freshness and warnings
        partial: typed value plus structured omissions
        failure: normalized AppError plus retry metadata
      cancellation: distinct from failure and never commits replacement state
  domain_records:
    SourceDescriptor:
      fields:
        id: SourceId
        kind: pcloud | webdav | local | saf | other
        display_name: String
        capabilities: Set<SourceCapability>
        account_reference: optional non-secret account ID
    MediaNode:
      variants:
        folder:
          required: [source_id, node_id, name]
          optional: [parent_id, modified_at, child_count_hint, permissions]
        audio_track:
          required: [source_id, node_id, parent_id, filename]
          optional:
            - content_type
            - size_bytes
            - revision
            - duration_ms
            - embedded_tags
            - cache_state
            - progress_summary
      invariants:
        - Audio track parent_id is mandatory.
        - Display path is derived cache, not identity.
        - Names may be untrusted Unicode and are never interpreted as local paths.
    StreamHandle:
      fields:
        uri: ephemeral HTTPS URI or verified local content URI
        expires_at: optional Instant
        content_type: optional String
        expected_length: optional Long
        expected_revision: optional Revision
        headers: minimal redacted-safe request headers
      persistence: forbidden except transient in-memory player state
    QueueSnapshot:
      fields:
        id: UUID
        generation: monotonically increasing Long
        created_at: Instant
        source_origin: optional FolderOrigin
        ordering: SortPolicy
        grouping: GroupPolicy
        duplicate_policy: DuplicatePolicy
        items: ordered list of QueueItem
        omissions: list of QueueOmission
      invariants:
        - Item order is complete and deterministic before commit.
        - Every QueueItem contains stable source, node, and parent identity.
        - A replacement snapshot with zero items requires explicit user confirmation.
    ProgressRecord:
      key: [source_id, node_id]
      fields:
        content_revision: optional Revision
        position_ms: non-negative Long
        duration_ms: optional positive Long
        playback_speed: positive Decimal
        state: new | in_progress | completed | explicitly_reset
        observed_at: Instant
        completed_at: optional Instant
      invariants:
        - position_ms is clamped to known duration.
        - completion state follows policy or explicit user action.
    SavedRoot:
      fields:
        id: UUID
        source_id: SourceId
        folder_id: NodeId
        display_name: non-empty String
        recursive: Boolean
        filter_policy: FilterPolicy
        sort_policy: SortPolicy
        group_policy: GroupPolicy
        resume_policy: ResumePolicy
        cache_policy: CachePolicy
        order_index: Int
        visible: Boolean
      invariants:
        - The root refers to a folder capability at creation time.
        - Rules are serializable and versioned.
    MetadataValue:
      fields:
        field: canonical metadata field
        raw_value: optional String or binary descriptor
        normalized_value: optional typed value
        source: provider | embedded | filename | path | external | user
        confidence: decimal from 0 to 1
        warnings: list of parser or conflict codes
    TagSnapshot:
      fields:
        format: non-empty container and tag-format description
        fields: canonical TagField to MetadataValue map
        artwork: bounded descriptors without mandatory image decoding
        warnings: parser and compatibility warnings
        duration_millis: optional positive duration from trustworthy local/container header evidence
      invariants:
        - Duration is evidence for display, matching, and derived playlist EXTINF only; it is not media identity.
        - Unknown or non-positive duration is represented as absent rather than guessed from size, bitrate, or tag text.
    TagPatch:
      mutations:
        Keep: preserve current field
        Clear: delete field when present
        Set: replace with a non-empty value
      invariants:
        - A patch contains at least one mutation.
        - Changed fields are calculated against a concrete TagSnapshot.
    TagEditPlan:
      fields:
        - plan_id
        - source_id
        - node_id
        - expected_revision or expected_content_hash
        - original TagSnapshot
        - TagPatch
        - optional external candidate ID
      invariants:
        - Remotely targetable plans require revision or content-hash evidence.
        - Candidate selection and write approval remain separate decisions.
    BatchTagEditPlan:
      fields: ordered TagEditPlan list, warnings, changed item count, changed field count
      invariants:
        - Stable media identities are unique within a batch.
        - Selection order is retained for deterministic sequencing.
    FolderTagRow:
      fields:
        - stable source, node, and parent identity
        - filename and direct-folder identity
        - fast content evidence and optional authoritative SHA-256
        - current TagSnapshot and parser warnings
        - proposed field mutations and approval state
        - changed-on-disk, conflict, apply, and verification state
      invariants:
        - Filename and stable identity remain present even when parsing fails.
        - Approval is tied to one snapshot generation and exact content evidence.
    FolderTagSnapshot:
      fields:
        - source ID and folder ID
        - monotonically increasing generation
        - observer mode and freshness
        - ordered direct-child FolderTagRow list
        - scan, warning, proposal, approval, and conflict counts
      invariants:
        - One generation represents one coherent reconciled folder view.
        - A cancelled or overflowed scan is never labelled complete and live.
    TagCorrectionProposal:
      fields:
        - proposal ID and rule version
        - stable file identity and snapshot generation
        - expected original content evidence and TagSnapshot
        - field-level Keep, Clear, or Set patch
        - explanation, provenance, confidence, assumptions, and warnings
        - automatically preselected Boolean
      invariants:
        - Proposal generation performs no source mutation.
        - Online, ambiguous, or lossy proposals are unselected by default.
    FolderChangeBatch:
      fields:
        - observer lease ID
        - source and folder identity
        - sequence or cursor when available
        - coalesced created, modified, deleted, moved, overflow, and invalidation changes
        - reconciliation_required Boolean
      invariants:
        - Event order is a hint and never replaces authoritative reconciliation.
        - Overflow or cursor reset requires a full folder snapshot.
    LocalFolderRootCapability:
      fields:
        - caller-selected canonical root directory
        - explicit SourceId owned by the local-source caller
        - readable and writable filesystem evidence
        - non-symlink root evidence
        - same-directory atomic-move capability evidence
      invariants:
        - Construction probes only unpredictable hidden non-media siblings and removes them before returning.
        - A provider cache, prepared metadata download, or signed stream capability is never promoted implicitly to a writable local root.
        - Capability existence grants local filesystem authority only inside the selected root; it grants no provider mutation authority.
    LocalFolderWorkbenchStatus:
      fields:
        - closed | starting | scanning | live | stale | overflow_rescanning | failed state
        - session revision and scan generation
        - folder and file counts
        - pending event count and summarized event kinds
        - pending derived-playlist regeneration count
        - reconciliation-required Boolean and last reconciled timestamp
        - user-safe status and optional error message
      invariants:
        - Complete private paths, provider URLs, raw tags, and media bytes are excluded from presentation state.
        - Live means an authoritative scan completed without a newer watcher event racing that generation.
    RepairPlan:
      fields:
        id: UUID
        created_at: Instant
        items:
          - source_id
          - node_id
          - expected_revision
          - approved_field_changes
          - staging_requirements
        state: draft | approved | applying | verified | partially_verified | failed | conflicted
      invariants:
        - Approved changes are immutable; edits create a new plan revision.
        - Applying requires revalidation against expected remote revision.
  ports:
    IF-AUDIO-SOURCE:
      purpose: Minimum browse and stream capability.
      methods:
        descriptor:
          input: none
          output: SourceDescriptor
        root:
          input: none
          output: AudioFolder
        list:
          input:
            folder_id: NodeId
            freshness: cache_allowed | fresh_required
          output: FolderListing
          errors: [auth, not_found, permission, connectivity, provider]
        resolve_stream:
          input:
            track_id: NodeId
            purpose: playback | inspection | download
          output: StreamHandle
          errors: [auth, not_found, permission, connectivity, provider]
        inspect_provider_metadata:
          input: NodeId
          output: ProviderInspection
      guarantees:
        - Stable IDs remain opaque outside adapter.
        - Direct links are not cached beyond safe expiry.
        - SDK types do not cross the interface.
    IF-SEARCHABLE-SOURCE:
      optional: true
      methods:
        search:
          input: query, optional root, filters, page cursor
          output: SearchPage with path context
    IF-CHANGE-FEED-SOURCE:
      optional: true
      methods:
        changes:
          input: optional cursor, limit, wait policy
          output: ordered changes plus next cursor and reset flag
      guarantees:
        - Cursor is persisted only after transactional application.
    IF-FOLDER-CHANGE-OBSERVER:
      optional: true
      methods:
        open:
          input: source ID, folder ID, direct scope, generation barrier
          output: observer lease plus initial cursor when supported
        observe:
          input: observer lease
          output: Flow of FolderChangeBatch
        close:
          input: observer lease
          output: completion
      guarantees:
        - Initial scan and event observation have no unobserved gap.
        - Watcher callbacks perform no tag parsing, hashing, or presentation work.
        - Invalid leases, overflow, and cursor reset are explicit reconciliation states.
        - Symbolic links are not followed outside the authorized folder.
      current_local_jvm_adapter:
        implementation: LocalFolderWorkbenchHost plus JDK WatchService behind LocalFolderRootCapability
        registration: observer directories are registered synchronously before initial scan
        events: audio create/modify/delete plus overflow and invalid-observer; rename is conservatively represented by create/delete and resolved by authoritative rescan rather than guessed
        coalescing: 250 ms quiet window with 2000 ms maximum latency by default
        self_events: never suppressed; mutation and rescan are serialized and every expected self-event is reconciled normally
        derived_playlists: M3U writes are excluded from media watcher events and remain guarded by playlist plan preflight
        client_binding: native desktop explicit local-directory selection only; Android prepared-copy and desktop pCloud/demo surfaces do not supply this capability
        desktop_source_identity: opaque SourceId from canonical selected-root identity plus opaque root-relative node IDs; metadata values never determine source or node identity
        desktop_stream: verified in-root regular audio file URI with no provider expiry semantics
        desktop_lifetime: changing away from the selected local source or closing the desktop controller closes the observer host and removes queued entries that depend on that root
        desktop_progress: reviewed tag dry-run/apply and recursive playlist writes expose completed/total progress only; complete private paths are not presentation data
        desktop_persistence: current selected local root is session-scoped; complete private paths are not persisted and restart requires explicit reselection
        flatpak_access: unavailable in the current package because there is no document-portal directory lease and broad host/home filesystem permission is intentionally absent
    IF-MUTABLE-SOURCE:
      optional: true
      methods:
        replace_file:
          input:
            node_id: NodeId
            expected_revision: Revision
            staged_content: ContentSource
          output: new revision and provider metadata
          errors: [conflict, permission, storage, connectivity, provider]
        move:
          input: node ID, destination folder ID, expected revision
          output: updated node identity and parent
        rename:
          input: node ID, new filename, expected revision
          output: updated metadata
    IF-CREDENTIAL-VAULT:
      methods:
        put:
          input: CredentialKey and secret bytes
          output: opaque CredentialHandle
        read:
          input: CredentialHandle
          output: secret bytes in scoped memory
        delete:
          input: CredentialHandle
          output: deletion result
      guarantees:
        - Secret bytes are never serialized by application records.
        - Read buffers are scoped and cleared when practical.
        - Android implementation is backed by Keystore-protected material.
    IF-QUEUE-REPOSITORY:
      methods:
        observe: Flow<QueueSnapshot>
        replace_atomically: expected generation plus new snapshot
        mutate_atomically: typed queue command plus expected generation
      concurrency:
        - Reject stale generation rather than silently overwrite concurrent user action.
    IF-PROGRESS-REPOSITORY:
      methods:
        get: stable media identity -> optional ProgressRecord
        observe_folder: folder identity -> progress projection
        upsert: ProgressRecord
        reset: identity plus explicit reason
      write_policy:
        - Coalesce frequent samples.
        - Force flush on lifecycle boundaries.
        - Stable source/node identity is resolved against the active queue before writing.
        - A forced flush returns an observable completion handle to orchestration tests.
    IF-PERSISTENCE-COMPATIBILITY-CORPUS:
      fixtures: spec/fixtures/0.1.5
      records: [queue_json, queue_index, progress_json]
      guarantees:
        - Android decodes and reproduces fixture bytes exactly.
        - Queue fixtures contain stable source, node, and origin identity only.
        - Progress fixtures contain stable identity, position, duration, speed, observation, and completion.
        - Signed URLs, tokens, provider bodies, and local paths are forbidden.
        - Linux 0.2.0 must replay the unchanged corpus before parity claims.
    IF-OFFLINE-CACHE:
      methods:
        status: stable media identity -> CacheEntry
        open_verified: identity and expected revision -> optional local content handle
        schedule_pin: PinPlan -> durable job ID
        evict: cache entry ID -> local-only deletion result
        reconcile: provider snapshots plus local files -> reconciliation report
      guarantees:
        - Eviction cannot call source deletion.
        - Verified state requires completed hash or revision validation.
    IF-PLAYBACK-GATEWAY:
      methods:
        submit_queue: QueueSnapshot and start index
        play: none
        pause: none
        seek: position
        skip: queue index delta or stable item ID
        set_speed: positive speed
        observe: Flow<PlaybackState>
      guarantees:
        - PlaybackState always contains stable media identity when an item is selected.
        - Ephemeral URI is not exposed to presentation.
    IF-AUDIO-TAG-TOOLKIT:
      methods:
        inspect:
          input: readable local audio file
          output: TagSnapshot
        stage_patch:
          input: source file, staging directory, TagPatch, optional expected source SHA-256
          output: source hash, staged file, staged hash, verified TagSnapshot, changed fields
      guarantees:
        - Source file bytes are not changed.
        - Incomplete staged candidates are removed on failure.
        - Set and Clear mutations are reread and verified before success.
    IF-METADATA-CONTENT-SOURCE:
      optional: true
      methods:
        prepare_metadata_source:
          input: stable node ID and unused app-private destination file
          output: local file, original filename, expected revision when available, SHA-256, size
      guarantees:
        - Source or provider bytes are not changed.
        - Returned local bytes match the reported SHA-256.
        - pCloud implementations compare provider revision and checksum before and after download.
        - Failed, mismatched, or conflicted downloads leave no destination file.
    IF-ONLINE-METADATA-PROVIDER:
      methods:
        search:
          input: title, artist, album, ISRC, optional duration, bounded result limit
          output: ordered MetadataCandidate list
      guarantees:
        - HTTPS only.
        - Provider identification and rate limits are enforced.
        - Candidates carry provenance and confidence.
        - Lookup has no mutation side effect.
    IF-ACOUSTIC-METADATA-PROVIDER:
      methods:
        lookup:
          input: configured application key, duration, encoded Chromaprint fingerprint
          output: MetadataCandidate list
      guarantees:
        - Application key is never committed or logged.
        - Audio bytes are not transmitted by lookup.
  application_commands:
    BrowseFolder:
      input: source ID, folder ID, freshness policy
      output: BrowserSnapshot
      side_effects: optional snapshot refresh
    BuildFolderQueue:
      input:
        source_id: SourceId
        folder_id: NodeId
        recursion: direct | subtree
        operation: replace | append | play_next | shuffle_replace | shuffle_append
        selection: AudioSelectionPolicy
        sorting: SortPolicy
        grouping: GroupPolicy
        duplicates: DuplicatePolicy
        partial_policy: reject | accept_with_report | ask
      output: QueueBuildResult
      commit_rule: Queue repository mutation occurs only after a complete plan or explicit partial acceptance.
    ResolvePlayableItem:
      input: queue item and optional cached preference
      output: verified local handle or fresh StreamHandle
    SavePlaybackProgress:
      input: stable media ID, revision, position, duration, speed, trigger, observation time
      output: stored record and completion transition
    InspectMetadata:
      input: stable media ID and depth basic | embedded | complete
      output: layered inspection with warnings and provenance
    OpenFolderTagWorkbench:
      input: source ID, folder ID, direct scope, observer preference
      output: live or explicitly polling FolderTagSnapshot
      commit_rule: Opening, scanning, watching, and reconciling perform no media mutation.
    OpenLocalFolderWorkbenchHost:
      input: explicit LocalFolderRootCapability, direct or explicitly recursive scope, rule profile, optional separately consented online lookup
      output: LocalFolderWorkbenchStatus plus revision-bound FolderMetadataSuiteSession operations
      commit_rule: The observer lease is established before scan; watcher callbacks can invalidate/reconcile only and have no tag-stage/apply command path.
    PlanFolderTagCorrections:
      input: immutable FolderTagSnapshot generation, enabled deterministic rules, explicit user edits
      output: ordered TagCorrectionProposal list and exact changed-item and changed-field counts
      commit_rule: Autocorrect generates or preselects proposals but never writes media bytes.
    ApplyLocalTagCorrections:
      input: explicitly approved proposals, expected SHA-256 and identity, atomic replacement capability
      output: per-file verified, skipped, conflicted, failed, or indeterminate results plus rollback evidence
      commit_rule: No replacement without staged reread, decoder validation, immediate source revalidation, atomic move, and final readback.
    PlanFolderPlaylist:
      input: one already-inspected direct-folder snapshot plus an explicit deterministic order
      output: immutable relative-path playlist plan with reviewed audio membership, fast evidence, authoritative SHA-256, and rendered UTF-8 M3U
      commit_rule: Planning changes no filesystem bytes and resolves no provider capability URL.
    MaterializeFolderPlaylist:
      input: the exact revision-bound playlist review previously presented plus explicit write confirmation
      output: written derived-playlist result with SHA-256 and entry/fallback counts
      commit_rule: Added, removed, or renamed audio children and stale size, modified-time, SHA-256, or session revision reject materialization and require reconciliation plus a new preview.
    PlanFolderPlaylistBatch:
      input: tree preview plus a playlist-specific recursive opt-in, grouping policy, and order
      output: immutable batch of playlist plans plus the reviewed recursive directory set and audio-child membership evidence for every reviewed directory, including empty directories
      commit_rule: Playlist recursion never enables or implies recursive tag mutation.
    MaterializeFolderPlaylistBatch:
      input: exact revision-bound reviewed playlist batch plus explicit write confirmation
      output: per-playlist results plus completed/total progress
      commit_rule: Reviewed subtree membership, every target, every entry, and the application-session revision are preflighted before the first derived playlist is replaced.
    InvalidateFolderMetadataSuiteSession:
      input: a relevant filesystem/source reconciliation signal and user-safe reason
      output: incremented session revision, revoked current preview/reviews, and cancelled queued derived-playlist regeneration
      commit_rule: Invalidation performs no scan, tag staging, tag apply, or media-byte write; a fresh reconciled preview is required before new approvals or playlist writes.
    ExecuteReviewedFolderTagBatch:
      input: current revision-bound tag review, dry-run mode or explicit write confirmation, and local staging capability
      output: dry-run preflight or sequential guarded apply results plus progress
      commit_rule: Recursive tag consent is independent from playlist consent, and any confirmed tag execution invalidates the session so derived playlists require a fresh post-write scan.
    SchedulePostSyncFolderPlaylists:
      input: current revision-bound reviewed playlist batch after source/local reconciliation
      output: bounded debounced derived-playlist work only
      commit_rule: The automatic path has no tag-plan input and no tag staging/apply dependency; reconciliation invalidation revokes queued work.
    PlanBatchTagEdit:
      input: ordered stable media identities, source revisions or hashes, transform or accepted candidate fields
      output: immutable BatchTagEditPlan with changed-field summary
      commit_rule: Produces no local or remote media mutation.
    StageTagEdit:
      input: approved TagEditPlan and exact local source bytes
      output: verified staged candidate and hashes
      commit_rule: Original source remains unchanged; staged candidate is not remote success.
    ExportStagedMetadata:
      input: one or more reread-verified staged candidates
      output: one audio file or ZIP with manifest, SHA-256, item count, and scoped content URI
      commit_rule: Export creates no provider mutation and exposes no app-private source path.
    SearchOnlineMetadata:
      input: consented MetadataSearchQuery and enabled provider
      output: candidates with provenance and confidence
      commit_rule: No field is accepted and no source is changed automatically.
    ApplyMetadataRepair:
      input: approved RepairPlan ID
      output: per-item verified, failed, conflicted, or indeterminate results
      commit_rule: No provider write without expected revision check.
  events:
    EVT-ACCOUNT-CONNECTED:
      payload: account ID, source ID, region, timestamp
      excludes: token and email unless explicitly allowed locally
    EVT-FOLDER-SNAPSHOT-UPDATED:
      payload: source ID, folder ID, generation, freshness, counts
    EVT-FOLDER-TAG-SNAPSHOT-UPDATED:
      payload: source ID, folder ID, generation, observer mode, changed row count, proposal count, conflict count
      excludes: complete private path, raw tags, content hashes, and media bytes
    EVT-QUEUE-COMMITTED:
      payload: queue ID, generation, operation type, item count, omission count
    EVT-PLAYBACK-SELECTED:
      payload: stable media ID, queue generation, index
    EVT-PROGRESS-CHECKPOINTED:
      payload: stable media ID, position bucket, trigger
    EVT-CACHE-VERIFIED:
      payload: stable media ID, revision, bytes
    EVT-REPAIR-VERIFIED:
      payload: plan ID, stable media ID, old revision, new revision
    EVT-OPERATION-FAILED:
      payload: operation ID, category, normalized code, retryable, attempt
      excludes: raw provider body unless redacted and user-exported
  persistence:
    DB-ACCOUNT:
      key: account_id
      columns:
        - source_id
        - provider_kind
        - display_name
        - regional_host
        - credential_handle
        - connected_at
        - last_success_at
      forbidden_columns: [token, password, signed_url]
    DB-FOLDER-SNAPSHOT:
      key: source_id, folder_id, generation
      columns:
        - fetched_at
        - freshness
        - children serialized or normalized relation
        - provider_cursor if applicable
      class: rebuildable
    DB-QUEUE:
      key: singleton profile or queue_id
      columns: [generation, created_at, current_index, ordering_json, grouping_json, duplicate_policy]
      class: user_state
    DB-TAG-WORKBENCH-DRAFT:
      key: source_id, folder_id, snapshot_generation
      columns: [rule_profile, proposal_patch_json, explicit_edits_json, approval_state, updated_at]
      class: user_state
      invalidation: file approval is removed when its content evidence changes
      forbidden_columns: [complete_private_path, raw_audio, token, signed_url]
    DB-QUEUE-ITEM:
      key: queue_id, ordinal
      columns: [source_id, node_id, parent_id, filename, revision, metadata_projection]
      class: user_state
    DB-PROGRESS:
      key: source_id, node_id
      columns: [revision, position_ms, duration_ms, speed, state, observed_at, completed_at]
      class: user_state
    DB-SAVED-ROOT:
      key: saved_root_id
      columns: [source_id, folder_id, display_name, policy_json, order_index, visible]
      class: user_state
    DB-CACHE-ENTRY:
      key: source_id, node_id, revision
      columns: [local_locator, size_bytes, expected_hash, verified_at, last_access_at, pin_state]
      class: verified_media_cache
    DB-REPAIR-AUDIT:
      key: audit_id
      columns:
        - plan_id
        - source_id
        - node_id
        - expected_revision
        - resulting_revision
        - approved_diff
        - state
        - started_at
        - completed_at
        - recovery_reference
      class: user_state
  normalized_errors:
    AppError:
      fields:
        category: authentication | connectivity | provider | media | storage | invariant | cancelled
        code: stable application code
        retryable: Boolean
        retry_after: optional Duration
        user_message_key: localized key
        diagnostic_id: opaque correlation ID
        cause_summary: redacted development description
      mapping_rules:
        - HTTP and SDK codes map in provider adapter.
        - UI never branches on raw exception class or message.
        - Retryability is explicit and bounded by command policy.
