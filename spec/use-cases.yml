use_cases:
  conventions:
    actors:
      user: authenticated listener or library maintainer
      app: properpcloud application
      source: pCloud or another AudioSource adapter
      platform: Android or Linux operating-system services
    outcome_types:
      success: requested stable state is committed and visible
      partial: useful subset completed and omissions are inspectable
      failure: no unsafe or ambiguous state change is committed
  cases:
    UC-NOW-PLAYING:
      traces: [REQ-MODERN-PLAYER, REQ-NAVIGATION, REQ-PLAYBACK]
      title: Operate playback from a dedicated player surface
      trigger: User taps the persistent mini-player.
      flow:
        - app: Open now playing without rebuilding the queue or player.
        - app: Render effective title, filename context, progress, duration, and queue position.
        - user: Scrub to a target position or use accessible transport controls.
        - app: Forward typed seek and transport commands to the Media3 controller.
        - user: Open queue, containing folder, or metadata inspection in one action.
      alternatives:
        no_selected_item: Show a calm empty state with Browse library action.
        unknown_duration: Disable exact scrubbing while preserving transport controls.
        controller_disconnected: Preserve queue context and surface reconnect state.
      tests: [TEST-PLAYER-DESTINATION, TEST-PLAYER-SEEK, TEST-NAV-CONTAINING-FOLDER]
    UC-STAGE-TAG-EDIT:
      traces: [REQ-METADATA-FOUNDATION, REQ-METADATA-WRITE]
      title: Create and verify a local metadata candidate
      preconditions:
        - Source bytes are available as a readable local staging input.
        - A field-level patch was explicitly approved.
      flow:
        - app: Verify optional expected source SHA-256.
        - app: Inspect original tags and calculate changed fields.
        - app: Copy bytes to a unique app-private staging file.
        - app: Apply only approved Set and Clear operations.
        - app: Reread staged tags and verify every intended field.
        - app: Return staged hash and snapshot without changing the source file.
      failure:
        changed_source: Abort before mutation.
        unsupported_or_malformed: Delete incomplete candidate and preserve source.
        verification_mismatch: Delete candidate and report invariant failure.
      tests: [TEST-TAG-STAGING, TEST-TAG-SOURCE-HASH, TEST-MUTATION-DRY-RUN]
    UC-MATCH-METADATA:
      traces: [REQ-METADATA-FOUNDATION, REQ-METADATA-PROPOSAL]
      title: Find reviewable external metadata candidates
      trigger: User explicitly requests online matching.
      flow:
        - app: Disclose which textual metadata, duration, or fingerprint will leave the device.
        - app: Prefer existing ISRC or MusicBrainz identifiers.
        - app: Query MusicBrainz with identified User-Agent and serialized rate limit.
        - app: Optionally map a configured AcoustID fingerprint result to MusicBrainz IDs.
        - app: Resolve Cover Art Archive reference only after release selection.
        - app: Return candidates with confidence and provenance; no patch is applied automatically.
      failure:
        rate_limited: Respect bounded retry and preserve local work.
        provider_unavailable: Keep manual and filename-derived workflow available.
        ambiguous: Require user choice and leave low-confidence fields unselected.
      tests: [TEST-METADATA-QUERY, TEST-METADATA-RATE, TEST-METADATA-XML-SECURITY]
    UC-EDIT-AND-EXPORT-METADATA:
      traces: [REQ-METADATA-FOUNDATION]
      title: Review, edit, verify, and export one file's embedded tags
      trigger: User selects Edit tags from a folder row, queue row, or now playing.
      flow:
        - app: Prepare exact app-private source bytes and revision/hash evidence.
        - app: Inspect embedded fields and show originals with provenance.
        - user: Edit fields or explicitly search MusicBrainz.
        - user: Select a candidate and accept individual proposed fields.
        - app: Apply only the reviewed draft to a separate candidate file.
        - app: Reread every changed field and calculate candidate SHA-256.
        - user: Share or save the verified candidate through a scoped content URI.
      failure:
        source_changed: Delete local source copy and show a conflict without editing.
        unsupported_format: Preserve source and explain that no candidate was produced.
        provider_unavailable: Keep manual editing available.
      tests: [TEST-PCLOUD-METADATA-DOWNLOAD, TEST-METADATA-DRAFT, TEST-TAG-STAGING, TEST-METADATA-EDITOR-UI]
    UC-BATCH-TAG-EXPORT:
      traces: [REQ-METADATA-FOUNDATION]
      title: Review and export a bounded batch of tag corrections
      trigger: User selects up to twenty audio files and opens Edit batch.
      flow:
        - app: Prepare and inspect each selected item independently.
        - user: Enable common fields, explicit clears, and optional track sequencing.
        - user: Optionally search and accept candidate fields per file.
        - app: Stage every changed item with cancellation-safe per-item status.
        - app: Package multiple verified candidates with a CSV manifest and SHA-256 evidence.
      constraints:
        - Blank common values never imply deletion.
        - Selection order controls sequence numbering.
        - Cloud objects remain unchanged.
      tests: [TEST-METADATA-BATCH-BLANK, TEST-TAG-SEQUENCE, TEST-METADATA-EXPORT, TEST-MUTATION-DRY-RUN]
    UC-REVIEW-FOLDER-TAGS:
      traces: [REQ-FOLDER-TAG-WORKBENCH, REQ-METADATA-FOUNDATION]
      title: Review and safely correct the tags of one folder
      trigger: User chooses Review tags for the current folder.
      preconditions:
        - The source exposes stable direct children and exact local bytes or a review-only prepared copy.
        - No recursive scope is implied by entering the workbench.
      flow:
        - app: Establish an observer lease and generation barrier for the selected folder.
        - app: Scan direct playable children and publish filename, identity, current tags, warnings, and content evidence.
        - app: Drain changes received during the scan and reconcile before reporting the view as live.
        - app: Generate deterministic correction proposals with rule explanations and provenance.
        - user: Filter rows, edit proposals, and approve individual fields and files.
        - app: Invalidate any approval whose file changed on disk.
        - user: Review the exact byte-affecting plan and confirm local replacement.
        - app: Stage, reread, decode-check, revalidate, atomically replace, reread, and reconcile each approved file.
        - app: Retain a bounded rollback reference and report verified, skipped, conflicted, failed, or indeterminate outcomes.
      alternatives:
        observer_overflow: Mark the view stale and perform a complete folder rescan.
        unsupported_format: Keep the file visible and disable apply for that row.
        source_changed: Revoke approval and require rescan or rebase before apply.
        non_atomic_filesystem: Offer verified export only and perform no source replacement.
        remote_source: Permit review, proposal, and export but no remote overwrite.
        online_match: Require separate disclosure and leave candidate fields unselected until reviewed.
      tests:
        - TEST-TAG-FOLDER-BOOTSTRAP
        - TEST-TAG-FOLDER-EVENT-COALESCING
        - TEST-TAG-FOLDER-OVERFLOW-RESCAN
        - TEST-TAG-FOLDER-SELF-EVENT
        - TEST-TAG-FOLDER-CONFLICT
        - TEST-TAG-FOLDER-ATOMIC-APPLY
        - TEST-TAG-FOLDER-ROLLBACK
        - TEST-TAG-FOLDER-NONATOMIC-EXPORT-ONLY
        - TEST-TAG-FOLDER-ACCESSIBILITY
    UC-AUTH-LOGIN:
      traces: [REQ-AUTH]
      title: Connect a pCloud account
      preconditions:
        - No valid session exists for the account slot.
        - Network is available.
      trigger: User selects Sign in to pCloud.
      flow:
        - app: Select explicit developer override or the release-bundled public application client ID.
        - app: Refuse to launch when neither application identity is available.
        - app: Create SDK-managed token-flow OAuth request and package-bound trusted redirect.
        - app: Open provider authorization surface.
        - user: Authenticate and approve at pCloud.
        - source: Return token and regional API location.
        - app: Validate nonce, account identity, and region.
        - app: Store token in platform vault and non-secret account metadata separately.
        - app: Build source client and load root folder.
        - app: Navigate to browser with account identity visible.
      alternatives:
        user_cancel:
          result: Return to disconnected state without alarming error.
        provider_denial:
          result: Show actionable error and retry.
        callback_mismatch:
          result: Discard response and emit redacted security diagnostic.
        root_load_failure:
          result: Keep authenticated state, show reconnect-versus-retry distinction.
      postconditions:
        success:
          - Region-bound client can list root.
          - No account password is stored.
          - No token or client secret was copied through the app UI.
        failure:
          - No half-created account or orphaned token remains.
      tests: [TEST-AUTH-CONFIG, TEST-AUTH-LOGIN, TEST-AUTH-CANCEL, TEST-AUTH-CALLBACK]
    UC-AUTH-DIRECT-LOGIN:
      traces: [REQ-AUTH]
      title: Connect through the documented fallback-only direct login
      preconditions:
        - No valid pCloud session exists.
        - User knows the account's Europe or United States storage region.
      trigger: User expands Fallback direct sign-in and submits email and password.
      flow:
        - app: Explain that OAuth remains preferred and direct login is fallback-only.
        - user: Select exactly one regional API and enter credentials.
        - app: Remove password text from form state before dispatch.
        - app: POST username, password, getauth, logout, device, and bounded expiry parameters over HTTPS to regional userinfo.
        - source: Return a legacy auth token and account identity, or a numeric rejection code.
        - app: Clear mutable password buffers, persist only encrypted token plus token kind, and load root.
      alternatives:
        wrong_region_or_credentials:
          result: Show a redacted message and optional numeric provider code; retain no password.
        network_failure:
          result: Show a retryable regional-network message; retain no password.
        two_factor_required:
          result: Explain that the public direct-login protocol may not support the challenge and recommend OAuth.
      postconditions:
        success:
          - Legacy token is encrypted and SDK requests use HTTPS form authentication.
          - No password exists in durable application state.
        failure:
          - No session or credential residue is created.
      tests: [TEST-AUTH-DIRECT, TEST-AUTH-LEGACY-TRANSPORT, TEST-AUTH-DIRECT-UI]
    UC-BROWSE-FOLDER:
      traces: [REQ-BROWSE, REQ-RESILIENCE]
      title: Navigate folder hierarchy
      trigger: User opens a saved root, breadcrumb, or folder row.
      flow:
        - app: Render cached snapshot immediately when present.
        - app: Request direct children by stable folder ID.
        - source: Return folders and files with stable metadata.
        - app: Classify playable files without requiring valid tags.
        - app: Merge a fresh snapshot transactionally.
        - app: Preserve scroll anchor and selection.
      offline:
        - Render last successful snapshot with stale timestamp.
        - Mark verified cached audio playable.
        - Mark uncached remote audio unavailable offline.
      failure:
        refresh_with_cache: Retain content and show non-blocking retry.
        no_cache: Show full error with retry and account diagnostics.
        permission_denied: Preserve breadcrumb context and explain access loss.
      tests: [TEST-BROWSE-FRESH, TEST-BROWSE-STALE, TEST-BROWSE-LARGE]
    UC-QUEUE-FOLDER:
      traces: [REQ-QUEUE, REQ-SORTING]
      title: Build queue from direct folder children
      input:
        folder_id: stable source node ID
        operation: replace | append | next | shuffle
        recursion: false
        order_policy: explicit current policy
        duplicate_policy: preserve | node | hash
      flow:
        - app: Acquire direct folder snapshot.
        - app: Select playable children.
        - app: Enrich from known tags without blocking on absent metadata.
        - app: Apply deterministic sort and tie-break policy.
        - app: Create immutable queue snapshot with provenance.
        - app: Persist queue atomically.
        - app: Resolve first selected item just in time when play intent requires it.
      partial:
        - Omit unsupported or inaccessible files.
        - Commit valid files and show omission count and reasons.
      empty:
        - Preserve existing queue.
        - Explain no direct playable children and offer subtree action.
      tests: [TEST-QUEUE-DIRECT, TEST-QUEUE-EMPTY, TEST-QUEUE-OMISSIONS]
    UC-QUEUE-SUBTREE:
      traces: [REQ-QUEUE, REQ-SORTING, REQ-RESILIENCE]
      title: Build queue from recursive subtree
      trigger: User chooses play or append subtree.
      safeguards:
        - Preview known or estimated size when large.
        - Support cancellation without queue mutation.
        - Bound provider request concurrency.
      flow:
        - app: Traverse with provider-native recursion or bounded breadth-first listing.
        - app: Emit discovery progress by folders, files, and bytes when known.
        - app: Collect stable candidates and omission report.
        - app: Group by relative folder path when configured.
        - app: Apply deterministic ordering.
        - app: Commit atomically after completion or explicit partial acceptance.
      failure_policy:
        authentication_failure: Abort and preserve current queue.
        root_not_found: Abort and preserve current queue.
        inaccessible_child: Record omission and continue.
        transient_network: Offer retry, accept partial, or cancel.
      tests: [TEST-QUEUE-RECURSIVE, TEST-QUEUE-CANCEL, TEST-QUEUE-PARTIAL]
    UC-PLAYER-OPEN-FOLDER:
      traces: [REQ-NAVIGATION]
      title: Open containing folder from playback
      trigger: User taps path or folder action in now playing.
      flow:
        - app: Resolve parent from queue item identity, never display-path parsing.
        - app: Open browser at parent folder.
        - app: Scroll to and highlight current item.
        - app: Keep playback uninterrupted.
      moved_or_deleted:
        - Refresh known parent and look up stable item identity when capability exists.
        - Navigate to new parent when discovered and explain move.
        - Otherwise show removed-item state while retaining queue history.
      tests: [TEST-NAV-CONTAINING-FOLDER, TEST-NAV-MOVED]
    UC-PLAY-REMOTE:
      traces: [REQ-PLAYBACK, REQ-RESILIENCE]
      title: Start or resume remote audio
      trigger: Queue selects an uncached item.
      flow:
        - app: Load stable identity and desired resume position.
        - app: Resolve fresh stream capability.
        - app: Construct platform media item with stable media ID and ephemeral URI.
        - platform: Prepare, expose timeline, seek, and play according to intent.
        - app: Publish media metadata and controls.
      recovery:
        expired_or_forbidden_link:
          immediate_refreshes_per_window: 1
          retry_cooldown: 60 seconds
          sequence:
            - discard capability URL
            - resolve new capability
            - resume from last confirmed position
            - allow a later retry after cooldown
        transient_network:
          result: Bounded backoff with visible retry and cancel.
        unsupported_decoder:
          result: Fail item, preserve queue, offer inspect, download, external-open, or skip.
      tests: [TEST-PLAY-REMOTE, TEST-PLAY-LINK-EXPIRY, TEST-SIGNED-LINK-RETRY-GATE, TEST-PLAY-RANGE]
    UC-SAVE-PROGRESS:
      traces: [REQ-PROGRESS]
      title: Persist and restore long-form position
      triggers:
        - periodic_checkpoint
        - pause
        - completed_seek
        - item_transition
        - app_background
        - service_teardown
      save_flow:
        - app: Read stable media ID, current position, duration, speed, and content revision.
        - app: Coalesce writes while preserving latest observation.
        - app: Apply completion policy.
        - app: Commit progress transactionally.
        - app: Return an observable persistence job for forced lifecycle checkpoints.
      restore_flow:
        - app: Compare stored and current content revision.
        - app: Seek to stored position minus smart rewind when compatible.
        - app: Ask restart, retain, or discard when content materially changed.
      tests: [TEST-PROGRESS-CHECKPOINT, TEST-PROGRESS-LIFECYCLE-FLUSH, TEST-PROGRESS-POLICY, TEST-PROGRESS-PROCESS-DEATH, TEST-PROGRESS-REVISION]
    UC-CREATE-SAVED-ROOT:
      traces: [REQ-SAVED-ROOTS]
      title: Create a custom tab from folder
      trigger: User chooses Add as tab.
      flow:
        - app: Pre-fill name and root identity.
        - user: Configure recursion, filters, sort, grouping, resume, and cache policy.
        - app: Validate policy and preview known matching count.
        - app: Persist saved-root definition.
        - app: Add tab without mutating source files.
      tests: [TEST-ROOT-CREATE, TEST-ROOT-POLICY, TEST-ROOT-RENAME]
    UC-PIN-OFFLINE:
      traces: [REQ-OFFLINE]
      title: Make folder available offline
      trigger: User chooses Make available offline.
      flow:
        - app: Enumerate direct or recursive target.
        - app: Estimate total bytes and compare quota.
        - user: Confirm target and network constraints.
        - app: Schedule resumable downloads by stable identity and expected hash.
        - app: Verify each completed file and publish pin state.
      failures:
        insufficient_storage:
          - Pause before quota breach.
          - Offer cache management without cloud deletion semantics.
        changed_remote_file:
          - Discard mismatched partial data.
          - Restart against new revision according to confirmation policy.
        lost_storage_permission:
          - Pause affected jobs and request access restoration.
      tests: [TEST-CACHE-PIN, TEST-CACHE-HASH, TEST-CACHE-EVICT]
    UC-INSPECT-METADATA:
      traces: [REQ-INSPECTION]
      title: Inspect file without mutation
      trigger: User selects Inspect.
      flow:
        - app: Load provider metadata and local cache state.
        - app: Read embedded tags from verified cache or bounded remote-read strategy.
        - app: Compute normalized and effective values with provenance.
        - app: Render raw, normalized, effective, and warning sections.
      constraints:
        - No local or remote media bytes are changed.
        - Capability URLs and credentials are not displayed.
      tests: [TEST-INSPECT-VALID, TEST-INSPECT-BROKEN-TAGS, TEST-INSPECT-REDACTION]
    UC-REPAIR-METADATA:
      traces: [REQ-METADATA-PROPOSAL, REQ-METADATA-WRITE]
      title: Review and apply metadata corrections
      preconditions:
        - Source exposes mutation and revision capabilities.
        - Account has modify permission.
      flow:
        - app: Scan selected files and capture original hashes or revisions.
        - app: Generate candidates from path, filename, tags, and enabled providers.
        - app: Show field proposals with confidence and provenance.
        - user: Approve, reject, or edit fields.
        - app: Show final byte-affecting plan and resource impact.
        - user: Confirm write.
        - app: Stage, edit, validate, upload with expected revision, and verify.
        - app: Record audit and recovery information.
      conflict:
        - Abort affected file before overwrite.
        - Show original, proposed, and current values.
        - Offer rebase, rescan, or skip.
      tests: [TEST-MUTATION-DRY-RUN, TEST-MUTATION-CONFLICT, TEST-MUTATION-VERIFY]
    UC-LOGOUT:
      traces: [REQ-AUTH]
      title: Disconnect account safely
      trigger: User confirms Disconnect.
      flow:
        - app: Stop provider requests and block new stream resolution.
        - app: Stop playback and clear the active queue when it contains provider media.
        - app: Invalidate local credential handle immediately.
        - app: Remove the provider source and switch to demo before any network request.
        - app: Attempt regional provider-side revocation using an HTTPS bearer header.
        - app: Report confirmed, already inactive, or unconfirmed remote invalidation separately.
        - user: Choose whether non-secret snapshots and offline files are retained.
        - app: Remove account from active UI and media hierarchy.
      postconditions:
        - No future request can use removed credentials.
        - Existing remote-only playback stops.
        - Retained verified offline files follow explicit user choice.
      tests: [TEST-AUTH-LOGOUT, TEST-AUTH-REMOTE-REVOKE, TEST-LOGOUT-PLAYBACK, TEST-LOGOUT-CACHE]
    UC-LINUX-PARITY:
      traces: [REQ-LINUX-PARITY]
      title: Continue the same folder-first library on native Linux
      preconditions:
        - Android 0.1.x queue, progress, identity, and source contracts are stable.
        - The unchanged spec/fixtures/0.1.5 corpus passes on Android and the Linux implementation.
        - mpv, Secret Service or KWallet, and a desktop browser are available.
      flow:
        - app: Load the same source-neutral contracts and pCloud java-core adapter.
        - user: Authorize through the system browser without exposing credentials to the app UI.
        - app: Browse folders, build deterministic queues, and inspect stable identities.
        - platform: Play through supervised mpv JSON IPC and publish MPRIS state.
        - app: Persist queue and progress in SQLite under XDG paths.
        - user: Operate every queue and playback action by mouse, context menu, or keyboard.
      compatibility:
        - GNOME and KDE use their native secret-service implementation.
        - i3 uses the same XDG, MPRIS, notification, and keyboard contracts without a desktop shell dependency.
      failure:
        missing_mpv: Explain the missing runtime dependency and preserve queue state.
        secret_service_locked: Keep the account disconnected and offer retry after unlock.
        crashed_player: Restart mpv once and resume from the latest confirmed position.
      tests:
        - TEST-LINUX-SHARED-CONTRACTS
        - TEST-LINUX-MPV-IPC
        - TEST-LINUX-MPRIS
        - TEST-LINUX-SECRET-STORE
        - TEST-LINUX-KEYBOARD
