name: linux
run-name: Linux verification · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Linux playback and D-Bus probes
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            mpv dbus-x11 libglib2.0-bin libsecret-tools gnome-keyring \
            xvfb xdotool imagemagick

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Cache Gradle data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/gradle
          key: linux-gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            linux-gradle-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Fetch verified Android tools archive
        run: make toolchain-archive

      - name: Build pinned project toolchain image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: properpcloud/android-build:2026.08
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify native Linux client
        run: make linux-ci DESKTOP_JAVA_HOME="$JAVA_HOME"

      - name: Verify 0.2.0 promotion matrix and bounded resilience soak
        run: |
          make release-020-readiness
          make desktop-locked-keyring-smoke DESKTOP_JAVA_HOME="$JAVA_HOME"
          make desktop-accessibility-audit DESKTOP_JAVA_HOME="$JAVA_HOME"
          PROPERPCLOUD_SOAK_SECONDS=15 make desktop-resilience-soak DESKTOP_JAVA_HOME="$JAVA_HOME"

      - name: Archive executable desktop image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-inputs
          epoch=$(git show -s --format=%ct HEAD)
          tar \
            --sort=name \
            --mtime="@${epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C desktop-app/build/compose/binaries/main/app \
            -cf - properpcloud \
            | gzip -n > .release-inputs/properpcloud-desktop-image.tar.gz

      - name: Upload executable desktop image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-linux-desktop-image
          if-no-files-found: error
          path: .release-inputs/properpcloud-desktop-image.tar.gz
          retention-days: 1

      - name: Upload Linux reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-linux-reports
          if-no-files-found: warn
          path: |
            desktop-app/build/reports/tests/**
            desktop-app/build/test-results/**
            build/evidence/0.2.0-resilience-soak.*
            build/evidence/0.2.0-locked-keyring.json
            build/evidence/0.2.0-accessibility*

  appimage:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified desktop image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: properpcloud-linux-desktop-image
          path: .release-inputs

      - name: Restore executable desktop image
        run: |
          mkdir -p desktop-app/build/compose/binaries/main/app
          tar -xzf .release-inputs/properpcloud-desktop-image.tar.gz \
            -C desktop-app/build/compose/binaries/main/app

      - name: Install AppImage smoke dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mpv

      - name: Build and smoke-test AppImage
        run: |
          set -euo pipefail
          make desktop-appimage-smoke PREBUILT_DESKTOP_IMAGE=1

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-appimage
          if-no-files-found: error
          path: build/releases/*.AppImage

  flatpak:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified desktop image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: properpcloud-linux-desktop-image
          path: .release-inputs

      - name: Restore executable desktop image
        run: |
          mkdir -p desktop-app/build/compose/binaries/main/app
          tar -xzf .release-inputs/properpcloud-desktop-image.tar.gz \
            -C desktop-app/build/compose/binaries/main/app

      - name: Install Flatpak toolchain and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            flatpak ostree mpv dbus-x11 libglib2.0-bin
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08

      - name: Build and smoke-test Flatpak
        run: |
          set -euo pipefail
          make desktop-flatpak-smoke PREBUILT_DESKTOP_IMAGE=1

      - name: Upload Flatpak
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-flatpak
          if-no-files-found: error
          path: build/releases/*.flatpak
