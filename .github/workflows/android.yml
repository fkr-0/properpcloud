name: android
run-name: Android verification · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PCLOUD_CLIENT_ID: ${{ vars.PCLOUD_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for documentation verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Cache Gradle data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gradle
            .cache/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Fetch verified Android tools archive
        run: make toolchain-archive

      - name: Fetch verified Robolectric runtime
        run: make robolectric-runtime

      - name: Build Android toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: properpcloud/android-build:2026.08
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify
        run: make ci

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: properpcloud-debug-and-reports
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/*/app-*.apk
            desktop-app/build/compose/binaries/main/app/**
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/test-results/**
