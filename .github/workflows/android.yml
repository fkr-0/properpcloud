name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Gradle data
        uses: actions/cache@v5
        with:
          path: |
            .cache/gradle
            .cache/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Fetch verified Android tools archive
        run: make toolchain-archive

      - name: Fetch verified Robolectric runtime
        run: make robolectric-runtime

      - name: Build Android toolchain image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: properpcloud/android-build:2026.08
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify
        run: make ci

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: properpcloud-debug-and-reports
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/test-results/**
