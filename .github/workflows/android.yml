name: android
run-name: Android verification · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PCLOUD_CLIENT_ID: ${{ vars.PCLOUD_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for documentation verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Cache Gradle data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/gradle
            .cache/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Fetch verified Android tools archive
        run: make toolchain-archive

      - name: Fetch verified Robolectric runtime
        run: make robolectric-runtime

      - name: Build Android toolchain image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: properpcloud/android-build:2026.08
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify
        run: make ci

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-debug-and-reports
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            desktop-app/build/compose/binaries/main/app/**
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/test-results/**
