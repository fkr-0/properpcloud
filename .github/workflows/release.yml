name: release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to rebuild, attest, and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      PCLOUD_CLIENT_ID: ${{ vars.PCLOUD_CLIENT_ID }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Describe immutable release target
        shell: bash
        run: |
          set -euo pipefail
          printf 'release_tag=%s\n' "$RELEASE_TAG"
          printf 'release_commit=%s\n' "$(git rev-parse HEAD)"
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "$RELEASE_TAG"

      - name: Validate optional bundled pCloud OAuth identity
        run: make release-client-id-check

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Cache Gradle data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/gradle
            .cache/robolectric
          key: release-gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            release-gradle-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Fetch verified Android tools archive
        run: make toolchain-archive

      - name: Fetch verified Robolectric runtime
        run: make robolectric-runtime

      - name: Build Android toolchain image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: properpcloud/android-build:2026.08
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate tag metadata
        run: |
          make release-check
          python3 scripts/validate-release.py --expect-tag --require-clean

      - name: Verify and build
        run: make ci

      - name: Prepare release artifacts
        run: make release-artifacts

      - name: Attest APK provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/properpcloud-*.apk

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/properpcloud-*.apk
            dist/SHA256SUMS
            dist/release-evidence.json
            dist/third-party/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
