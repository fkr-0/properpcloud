name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to rebuild, attest, and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Gradle data
        uses: actions/cache@v5
        with:
          path: |
            .cache/gradle
            .cache/robolectric
          key: release-gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            release-gradle-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Fetch verified Android tools archive
        run: make toolchain-archive

      - name: Fetch verified Robolectric runtime
        run: make robolectric-runtime

      - name: Build Android toolchain image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: properpcloud/android-build:2026.08
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate tag metadata
        run: |
          make release-check
          python3 scripts/validate-release.py --expect-tag --require-clean

      - name: Verify and build
        run: make ci

      - name: Prepare release artifacts
        run: make release-artifacts

      - name: Attest APK provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/properpcloud-*.apk

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: properpcloud-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/properpcloud-*.apk
            dist/SHA256SUMS
            dist/release-evidence.json
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
