name: release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to rebuild, attest, and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      PCLOUD_CLIENT_ID: ${{ vars.PCLOUD_CLIENT_ID }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js for documentation verification
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Describe immutable release target
        shell: bash
        run: |
          set -euo pipefail
          printf 'release_tag=%s\n' "$RELEASE_TAG"
          printf 'release_commit=%s\n' "$(git rev-parse HEAD)"
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "$RELEASE_TAG"

      - name: Validate optional bundled pCloud OAuth identity
        run: make release-client-id-check

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Cache Gradle data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/gradle
            .cache/robolectric
          key: release-gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            release-gradle-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Fetch verified Android tools archive
        run: make toolchain-archive

      - name: Fetch verified Robolectric runtime
        run: make robolectric-runtime

      - name: Build Android toolchain image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: properpcloud/android-build:2026.08
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate tag metadata
        run: |
          make release-check
          python3 scripts/validate-release.py --expect-tag --require-clean

      - name: Verify and build Android plus shared desktop image
        run: make ci

      - name: Upload release verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-release-reports-${{ env.RELEASE_TAG }}
          if-no-files-found: warn
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            app/build/reports/lint-results-debug.html

      - name: Prepare Android release baseline
        run: make release-artifacts

      - name: Archive executable desktop image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-inputs
          epoch=$(git show -s --format=%ct HEAD)
          tar \
            --sort=name \
            --mtime="@${epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C desktop-app/build/compose/binaries/main/app \
            -cf - properpcloud \
            | gzip -n > .release-inputs/properpcloud-desktop-image.tar.gz

      - name: Upload Android release baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-android-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: dist/

      - name: Upload shared desktop image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-desktop-image-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: .release-inputs/properpcloud-desktop-image.tar.gz
          retention-days: 1

  appimage:
    needs: android
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    timeout-minutes: 20

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Download shared desktop image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: properpcloud-desktop-image-${{ env.RELEASE_TAG }}
          path: .release-inputs

      - name: Restore executable desktop image
        run: |
          mkdir -p desktop-app/build/compose/binaries/main/app
          tar -xzf .release-inputs/properpcloud-desktop-image.tar.gz \
            -C desktop-app/build/compose/binaries/main/app

      - name: Install AppImage smoke dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mpv

      - name: Build and smoke-test AppImage
        run: |
          set -euo pipefail
          make desktop-appimage PREBUILT_DESKTOP_IMAGE=1
          appimage=$(find build/releases -maxdepth 1 -type f \
            -name 'properpcloud-*-x86_64.AppImage' -print -quit)
          test -n "$appimage"
          bash scripts/run-clean-profile.sh bash scripts/appimage-smoke.sh "$appimage"

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-appimage-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: build/releases/*.AppImage

  flatpak:
    needs: android
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Download shared desktop image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: properpcloud-desktop-image-${{ env.RELEASE_TAG }}
          path: .release-inputs

      - name: Restore executable desktop image
        run: |
          mkdir -p desktop-app/build/compose/binaries/main/app
          tar -xzf .release-inputs/properpcloud-desktop-image.tar.gz \
            -C desktop-app/build/compose/binaries/main/app

      - name: Install Flatpak toolchain and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            flatpak ostree mpv dbus-x11 libglib2.0-bin
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08

      - name: Build and smoke-test Flatpak
        run: |
          set -euo pipefail
          make desktop-flatpak PREBUILT_DESKTOP_IMAGE=1
          bundle=$(find build/releases -maxdepth 1 -type f \
            -name 'properpcloud-*-x86_64.flatpak' -print -quit)
          test -n "$bundle"
          bash scripts/flatpak-bundle-smoke.sh "$bundle"

      - name: Upload Flatpak
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-flatpak-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: build/releases/*.flatpak

  publish:
    needs: [android, appimage, flatpak]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Download Android release baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: properpcloud-android-${{ env.RELEASE_TAG }}
          path: dist

      - name: Download AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: properpcloud-appimage-${{ env.RELEASE_TAG }}
          path: .release-inputs/appimage

      - name: Download Flatpak
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: properpcloud-flatpak-${{ env.RELEASE_TAG }}
          path: .release-inputs/flatpak

      - name: Finalize checksums, evidence, and release notes
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find .release-inputs/appimage -maxdepth 1 -type f \
            -name '*.AppImage' -print -quit)
          flatpak=$(find .release-inputs/flatpak -maxdepth 1 -type f \
            -name '*.flatpak' -print -quit)
          test -n "$appimage"
          test -n "$flatpak"
          python3 scripts/finalize-release-artifacts.py \
            --dist dist \
            --appimage "$appimage" \
            --flatpak "$flatpak" \
            --flatpak-runtime-version 25.08
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python3 scripts/release_graph.py \
            --dist dist \
            --version "${RELEASE_TAG#v}" \
            --commit "$GITHUB_SHA"

      - name: Attest release distributables
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/properpcloud-*

      - name: Upload complete release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: properpcloud-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/properpcloud-*.apk
            dist/properpcloud-*.AppImage
            dist/properpcloud-*.flatpak
            dist/SHA256SUMS
            dist/release-evidence.json
            dist/third-party/*
          fail_on_unmatched_files: true
          generate_release_notes: false
